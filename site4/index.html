<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- before the stylesheets: a script after them would wait for Google Fonts to load -->
<script src="js/link.js"></script>
<title>BUNNyS, Sylas Lyu</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cockpit.css">
</head>
<body class="hub">
<main id="cockpit" aria-label="Cockpit">
  <h1 class="sr-only">BUNNyS cockpit, RX-124 TR-6 [WOUNDWORT]</h1>
  <div id="pano" aria-hidden="true">
    <div class="pano-ring">
      <!-- the sphere's .pano-slice tiles are generated by cockpit.js; each contact is an arrowhead
           on the horizon at its bearing (data-readout: bearing / range) -->
      <div class="target" id="t-pilot" data-yaw="-52" data-href="pilot.html" data-label="PILOT" data-readout="308 / 0.4 KM" data-info="Sylas Lyu, junior, psychology and UX, Purdue"></div>
      <div class="target" id="t-missions" data-yaw="0" data-href="missions.html" data-label="MISSIONS" data-readout="000 / 1.2 KM" data-info="5 missions, 2 active"></div>
      <div class="target" id="t-hangar" data-yaw="52" data-href="hangar.html" data-label="HANGAR" data-readout="052 / 0.1 KM" data-info="RX-124 TR-6, pilot Sylas Lyu"></div>
      <div class="target is-hostile" id="t-unknown" data-yaw="180" data-href="unknown.html" data-label="UNKNOWN" data-readout="180 / NO IFF" data-info="No transponder, open channel"></div>
    </div>
  </div>
  <svg id="hud" aria-hidden="true"></svg>
  <nav id="targets-nav" aria-label="Cockpit targets">
    <ul>
      <li><a href="pilot.html" data-target="t-pilot">Pilot: Sylas Lyu</a></li>
      <li><a href="missions.html" data-target="t-missions">Missions: research</a></li>
      <li><a href="hangar.html" data-target="t-hangar">Hangar: RX-124 TR-6</a></li>
      <li><a href="unknown.html" data-target="t-unknown">Unknown: open channel</a></li>
    </ul>
  </nav>
  <div id="insignia" aria-hidden="true"><div class="insignia-coin"><img src="img/emblem-hud.webp" alt=""><img src="img/emblem-hud.webp" alt=""></div></div>
  <p id="lock-status" class="sr-only" aria-live="polite"></p>
</main>
<script src="js/bunnys.js" defer></script>
<script src="js/hud.js" defer></script>
<script src="js/cockpit.js" defer></script>
</body>
</html>
