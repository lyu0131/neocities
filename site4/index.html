<html lang="en">
<head>
<meta charset="utf-8">

<body class="hub">
<main id="cockpit" aria-label="Cockpit">
  <h1 class="sr-only">BUNNyS cockpit, RX-124 TR-6 [WOUNDWORT]</h1>
  <div id="pano" aria-hidden="true">
    <div class="pano-ring">
      <!-- 24 .pano-slice elements are generated by cockpit.js -->
      <div class="target" id="t-pilot" data-yaw="-52" data-href="pilot.html" data-label="PILOT" data-readout="ID SYLAS LYU / RNG 0.4 KM" data-info="JUNIOR / PSYCHOLOGY + UX, PURDUE" data-brief="Psychology and UX design junior, Purdue.|Research on how everyday data informs|mental health and healthcare decisions."></div>
      <div class="target" id="t-missions" data-yaw="0" data-href="missions.html" data-label="MISSIONS" data-readout="2 ACTIVE / RNG 1.2 KM" data-info="5 MISSIONS / 2 ACTIVE" data-brief="Active: UNC NIcE X Lab and Human|Betterment Analytics Lab, Purdue.|Archive: Brown CNTR, Antagen, BrainCo."></div>
      <div class="target" id="t-hangar" data-yaw="52" data-href="hangar.html" data-label="HANGAR" data-readout="RX-124 TR-6 / RNG 0.1 KM" data-info="RX-124 TR-6 / PILOT SYLAS LYU" data-brief="Mechanical design: Kenki Fujioka.|The 3D model turns; callouts|light each of its eight parts."></div>
      <div class="target" id="t-manual" data-yaw="104" data-href="manual.html" data-label="FIELD MANUAL" data-readout="LIBRARY / RNG 0.2 KM" data-info="FIELD MANUALS" data-brief="General guides to working with AI.|Each one complete on its own,|with exercises and copyable code."></div>
      <div class="target" id="t-unknown" data-yaw="180" data-href="unknown.html" data-label="UNKNOWN" data-readout="UNIDENTIFIED MS / NO IFF" data-info="NO TRANSPONDER / DO NOT ENGAGE" data-brief="No transponder. No IFF response.|Bearing holds at 180.|Do not engage."></div>
    </div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <svg id="screens" aria-hidden="true"></svg>
  <img id="frame" src="img/frame.svg" alt="" width="1920" height="1080">
  <svg id="hud" aria-hidden="true"></svg>
  <nav id="targets-nav" aria-label="Cockpit targets">
    <ul>
      <li><a href="pilot.html" data-target="t-pilot">Pilot: Sylas Lyu</a></li>
      <li><a href="missions.html" data-target="t-missions">Missions: research</a></li>
      <li><a href="hangar.html" data-target="t-hangar">Hangar: RX-124 TR-6</a></li>
      <li><a href="manual.html" data-target="t-manual">Field manual: library of guides</a></li>
      <li><a href="unknown.html" data-target="t-unknown">Unknown: open channel</a></li>
    </ul>
  </nav>
  <div id="slew" class="slew">
    <p class="slew-head">SLEW TO</p>
    <ul>
      <li><button type="button" data-slew="t-pilot" aria-keyshortcuts="1"><kbd aria-hidden="true">1</kbd>PILOT</button></li>
      <li><button type="button" data-slew="t-missions" aria-keyshortcuts="2"><kbd aria-hidden="true">2</kbd>MISSIONS</button></li>
      <li><button type="button" data-slew="t-hangar" aria-keyshortcuts="3"><kbd aria-hidden="true">3</kbd>HANGAR</button></li>
      <li><button type="button" data-slew="t-manual" aria-keyshortcuts="4"><kbd aria-hidden="true">4</kbd>MANUAL</button></li>
      <li><button type="button" data-slew="t-unknown" aria-keyshortcuts="5"><kbd aria-hidden="true">5</kbd>UNKNOWN</button></li>
    </ul>
  </div>

  <div id="hudmode" class="slew hudmode">
    <p class="slew-head">HUD MODE</p>
    <ul>
      <li><button type="button" data-mode="declutter" aria-pressed="false" aria-keyshortcuts="X"><kbd aria-hidden="true">X</kbd>DECLUTTER</button></li>
      <li><button type="button" data-mode="nv" aria-pressed="false" aria-keyshortcuts="N"><kbd aria-hidden="true">N</kbd>NIGHT VIS</button></li>
      <li><button type="button" data-mode="diag" aria-keyshortcuts="R"><kbd aria-hidden="true">R</kbd>RUN DIAG</button></li>
      <li><button type="button" data-mode="comms" aria-keyshortcuts="C"><kbd aria-hidden="true">C</kbd>COMMS</button></li>
    </ul>
  </div>

  <div id="insignia" aria-hidden="true"><div class="insignia-coin"><img src="img/emblem-hud.webp" alt=""><img src="img/emblem-hud.webp" alt=""></div></div>

  <section id="comms" class="pop comms" aria-label="Incoming transmission" hidden>
    <p class="pop-head"><span class="comms-from"></span><span class="comms-ch">CH 07</span></p>
    <p class="comms-msg"></p>
    <button type="button" class="comms-ack">ACK</button>
  </section>
  <p id="toast" class="pop toast" role="status" aria-live="polite" hidden></p>
  <div class="nv-tint" aria-hidden="true"></div>
  <div class="nv-scan" aria-hidden="true"></div>

  <p id="lock-status" class="sr-only" aria-live="polite"></p>
</main>
<!-- the boot's picture: above the panorama, under the five canopy screens and the frame -->
<canvas id="boot-scene" aria-hidden="true"></canvas>
<div id="boot" role="presentation">
  <img class="boot-emblem" src="img/emblem-hud.webp" width="592" height="471" alt="" aria-hidden="true">
  <div class="boot-readout" aria-hidden="true">
    <p class="boot-stage"><span class="pips"><i></i><i></i><i></i><i></i></span><span class="boot-stage-txt">BUNNyS</span></p>
    <pre id="boot-log"></pre>
  </div>
  <div class="boot-cap" aria-hidden="true"><p class="boot-title"></p><p class="boot-note"></p></div>
  <div class="boot-bar" aria-hidden="true"><i></i></div>
  <a id="cv" class="hud-btn" href="resume.html">Plain r&eacute;sum&eacute;</a>
  <button id="skip" class="hud-btn" type="button" aria-keyshortcuts="Space">Skip boot <kbd aria-hidden="true">SPACE</kbd></button>
</div>
<script src="js/bunnys.js" defer></script>
<script src="js/dmgmap.js" defer></script>
<script src="js/hud.js" defer></script>
<script src="js/cockpit.js" defer></script>
<script src="js/fx.js" defer></script>
<script src="js/boot.js" defer></script>
</body>
</html>
