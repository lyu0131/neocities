<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BUNNyS, Sylas Lyu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cockpit.css">
</head>
<body class="hub">
<main id="cockpit" aria-label="Cockpit">
  <h1 class="sr-only">BUNNyS cockpit, SL-01</h1>
  <div id="pano" aria-hidden="true">
    <div class="pano-ring">
      <!-- 24 .pano-slice elements are generated by cockpit.js -->
      <div class="target" id="t-pilot" data-yaw="-52" data-href="pilot.html" data-label="PILOT" data-readout="ID SYLAS LYU / RNG 0.4 KM" data-info="PSYCHOLOGY AND UX DESIGN, PURDUE" data-brief="Psychology and UX design at Purdue.|Research on how everyday data informs|mental health and healthcare decisions."></div>
      <div class="target" id="t-missions" data-yaw="0" data-href="missions.html" data-label="MISSIONS" data-readout="2 ACTIVE / RNG 1.2 KM" data-info="TWO RESEARCH POSTS ACTIVE" data-brief="UNC NIcE X Lab, July 2026 to now.|Human Betterment Analytics, Purdue,|December 2025 to now."></div>
      <div class="target" id="t-hangar" data-yaw="52" data-href="hangar.html" data-label="HANGAR" data-readout="RX-124 TR-6 / RNG 0.1 KM" data-info="RX-124 TR-6 / THREE-VIEW AND SPECS" data-brief="Front, side and rear three-view.|Callouts light each part.|Design specifications."></div>
      <div class="target" id="t-unknown" data-yaw="180" data-label="UNKNOWN" data-readout="UNIDENTIFIED MS / NO IFF" data-info="NO TRANSPONDER / DO NOT ENGAGE" data-brief="No transponder. No IFF response.|Bearing holds at 180.|Do not engage."></div>
    </div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <svg id="screens" aria-hidden="true"></svg>
  <img id="frame" src="img/frame.svg" alt="" width="1920" height="1080">
  <svg id="hud" aria-hidden="true"></svg>
  <nav id="targets-nav" aria-label="Cockpit targets">
    <ul>
      <li><a href="pilot.html" data-target="t-pilot">Pilot: Sylas Lyu</a></li>
      <li><a href="missions.html" data-target="t-missions">Missions: research</a></li>
      <li><a href="hangar.html" data-target="t-hangar">Hangar: RX-124 TR-6</a></li>
    </ul>
  </nav>
  <div id="slew" class="slew">
    <p class="slew-head">SLEW TO</p>
    <ul>
      <li><button type="button" data-slew="t-pilot">PILOT</button></li>
      <li><button type="button" data-slew="t-missions">MISSIONS</button></li>
      <li><button type="button" data-slew="t-hangar">HANGAR</button></li>
      <li><button type="button" data-slew="t-unknown">UNKNOWN</button></li>
    </ul>
  </div>

  <div id="hudmode" class="slew hudmode">
    <p class="slew-head">HUD MODE</p>
    <ul>
      <li><button type="button" data-mode="declutter" aria-pressed="false">DECLUTTER</button></li>
      <li><button type="button" data-mode="nv" aria-pressed="false">NIGHT VIS</button></li>
      <li><button type="button" data-mode="diag">RUN DIAG</button></li>
      <li><button type="button" data-mode="comms">COMMS</button></li>
    </ul>
  </div>

  <section id="comms" class="pop comms" aria-label="Incoming transmission" hidden>
    <p class="pop-head"><span class="comms-from"></span><span class="comms-ch">CH 07</span></p>
    <p class="comms-msg"></p>
    <button type="button" class="comms-ack">ACK</button>
  </section>
  <p id="toast" class="pop toast" role="status" aria-live="polite" hidden></p>
  <div class="nv-tint" aria-hidden="true"></div>
  <div class="nv-scan" aria-hidden="true"></div>

  <p id="lock-status" class="sr-only" aria-live="polite"></p>
  <button id="tilt" class="hud-btn" type="button" hidden>Enable tilt</button>
</main>
<!-- the boot's picture: above the panorama, under the five canopy screens and the frame -->
<canvas id="boot-scene" aria-hidden="true"></canvas>
<div id="boot" role="presentation">
  <p class="boot-stage" aria-hidden="true"><span class="pips"><i></i><i></i><i></i><i></i></span><span class="boot-stage-txt">BUNNyS</span></p>
  <pre id="boot-log" aria-hidden="true"></pre>
  <div class="boot-cap" aria-hidden="true"><p class="boot-title"></p><p class="boot-note"></p></div>
  <div class="boot-bar" aria-hidden="true"><i></i></div>
  <button id="skip" class="hud-btn" type="button">Skip boot</button>
</div>
<script src="js/bunnys.js" defer></script>
<script src="js/dmgmap.js" defer></script>
<script src="js/hud.js" defer></script>
<script src="js/cockpit.js" defer></script>
<script src="js/fx.js" defer></script>
<script src="js/boot.js" defer></script>
</body>
</html>
