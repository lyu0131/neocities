<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- before the stylesheets: a script after them would wait for Google Fonts to load -->
<script src="js/link.js"></script>
<title>Woundwort, interfaces for when the stakes are real</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cockpit.css">
</head>
<body class="hub">
<main id="cockpit" aria-label="Cockpit">
  <h1 class="sr-only">Woundwort: a UX practice that designs and ships interaction systems</h1>
  <div id="pano" aria-hidden="true">
    <div class="pano-ring">
      <!-- 24 .pano-slice elements are generated by cockpit.js -->
      <div class="target" id="t-pilot" data-yaw="-52" data-href="pilot.html" data-label="STUDIO" data-readout="WOUNDWORT / UX PRACTICE" data-info="INTERFACES FOR HIGH-STAKES TEAMS" data-brief="We design and ship the interfaces|people use when the stakes are real.|Specs, states and tools that hold up."></div>
      <div class="target" id="t-missions" data-yaw="0" data-href="missions.html" data-label="SERVICES" data-readout="3 SERVICES / OPEN" data-info="SYSTEMS / CLAUDE TOOLING / TESTS" data-brief="Interaction systems that survive handoff.|Claude tooling tied to your design system.|Sparse briefs into testable prototypes."></div>
      <div class="target" id="t-hangar" data-yaw="52" data-href="hangar.html" data-label="TOOLS" data-readout="3 TOOLS / IN BUILD" data-info="CLAUDE TOOLS / CLIENT WORK" data-brief="A flow generator, a design-system|assistant and a critique agent.|The namesake turns in the bay."></div>
      <div class="target" id="t-unknown" data-yaw="180" data-href="unknown.html" data-label="CONTACT" data-readout="OPEN CHANNEL / BRG 180" data-info="YUTINGLYU@WOUNDWORT.XYZ" data-brief="Have a design system and a deadline?|Open the channel and send the brief.|Bearing holds at 180."></div>
    </div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <svg id="screens" aria-hidden="true"></svg>
  <img id="frame" src="img/frame.svg" alt="" width="1920" height="1080">
  <svg id="hud" aria-hidden="true"></svg>
  <nav id="targets-nav" aria-label="Cockpit targets">
    <ul>
      <li><a href="pilot.html" data-target="t-pilot">Studio: who we are</a></li>
      <li><a href="missions.html" data-target="t-missions">Services: what we do</a></li>
      <li><a href="hangar.html" data-target="t-hangar">Tools: what we are building</a></li>
      <li><a href="unknown.html" data-target="t-unknown">Contact: open channel</a></li>
    </ul>
  </nav>
  <div id="slew" class="slew">
    <p class="slew-head">SLEW TO</p>
    <ul>
      <li><button type="button" data-slew="t-pilot" aria-keyshortcuts="1"><kbd aria-hidden="true">1</kbd>STUDIO</button></li>
      <li><button type="button" data-slew="t-missions" aria-keyshortcuts="2"><kbd aria-hidden="true">2</kbd>SERVICES</button></li>
      <li><button type="button" data-slew="t-hangar" aria-keyshortcuts="3"><kbd aria-hidden="true">3</kbd>TOOLS</button></li>
      <li><button type="button" data-slew="t-unknown" aria-keyshortcuts="4"><kbd aria-hidden="true">4</kbd>CONTACT</button></li>
    </ul>
  </div>

  <div id="hudmode" class="slew hudmode">
    <p class="slew-head">HUD MODE</p>
    <ul>
      <li><button type="button" data-mode="declutter" aria-pressed="false" aria-keyshortcuts="X"><kbd aria-hidden="true">X</kbd>DECLUTTER</button></li>
      <li><button type="button" data-mode="nv" aria-pressed="false" aria-keyshortcuts="N"><kbd aria-hidden="true">N</kbd>NIGHT VIS</button></li>
      <li><button type="button" data-mode="diag" aria-keyshortcuts="R"><kbd aria-hidden="true">R</kbd>RUN DIAG</button></li>
      <li><button type="button" data-mode="comms" aria-keyshortcuts="C"><kbd aria-hidden="true">C</kbd>COMMS</button></li>
    </ul>
  </div>

  <div id="insignia" aria-hidden="true"><div class="insignia-coin"><img src="img/emblem-hud.webp" alt=""><img src="img/emblem-hud.webp" alt=""></div></div>

  <section id="comms" class="pop comms" aria-label="Incoming transmission" hidden>
    <p class="pop-head"><span class="comms-from"></span><span class="comms-ch">CH 07</span></p>
    <p class="comms-msg"></p>
    <button type="button" class="comms-ack">ACK</button>
  </section>
  <p id="toast" class="pop toast" role="status" aria-live="polite" hidden></p>
  <div class="nv-tint" aria-hidden="true"></div>
  <div class="nv-scan" aria-hidden="true"></div>

  <p id="lock-status" class="sr-only" aria-live="polite"></p>
</main>
<!-- the boot's picture: above the panorama, under the five canopy screens and the frame -->
<canvas id="boot-scene" aria-hidden="true"></canvas>
<div id="boot" role="presentation">
  <img class="boot-emblem" src="img/emblem-hud.webp" width="592" height="471" alt="" aria-hidden="true">
  <div class="boot-readout" aria-hidden="true">
    <p class="boot-stage"><span class="pips"><i></i><i></i><i></i><i></i></span><span class="boot-stage-txt">WOUNDWORT</span></p>
    <pre id="boot-log"></pre>
  </div>
  <div class="boot-cap" aria-hidden="true"><p class="boot-title"></p><p class="boot-note"></p></div>
  <div class="boot-bar" aria-hidden="true"><i></i></div>
  <button id="skip" class="hud-btn" type="button" aria-keyshortcuts="Space">Skip boot <kbd aria-hidden="true">SPACE</kbd></button>
</div>
<script src="js/bunnys.js" defer></script>
<script src="js/dmgmap.js" defer></script>
<script src="js/hud.js" defer></script>
<script src="js/cockpit.js" defer></script>
<script src="js/fx.js" defer></script>
<script src="js/boot.js" defer></script>
</body>
</html>
