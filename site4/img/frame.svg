<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
<title>ARGUS cockpit frame</title>
<defs>
<linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#060A12" stop-opacity=".38"/>
<stop offset="1" stop-color="#060A12" stop-opacity="0"/>
</linearGradient>
<radialGradient id="domeFade" cx="50%" cy="46%" r="65%">
<stop offset="0%" stop-color="#fff" stop-opacity="0"/>
<stop offset="55%" stop-color="#fff" stop-opacity=".35"/>
<stop offset="100%" stop-color="#fff" stop-opacity="1"/>
</radialGradient>
<mask id="domeFadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
<rect x="0" y="0" width="1920" height="1080" fill="url(#domeFade)"/>
</mask>
</defs>

<rect x="0" y="0" width="1920" height="170" fill="url(#vig)"/>

<g id="seams" fill="none" stroke="#8CFFC1" stroke-width="1" stroke-linecap="square">
  <g mask="url(#domeFadeMask)">
    <g stroke-opacity=".42">
      <path d="M0,90 C480,25 1440,25 1920,90"/>
      <path d="M0,140 C480,39 1440,39 1920,140"/>
      <path d="M0,190 C480,53 1440,53 1920,190"/>
    </g>
    <g stroke-opacity=".32">
      <path d="M0,225 C480,63 1440,63 1920,225"/>
      <path d="M0,250 C480,70 1440,70 1920,250"/>
    </g>
    <g stroke-opacity=".3">
      <path d="M260,0 C250,180 235,380 230,560"/>
      <path d="M205,0 C198,190 180,400 170,600"/>
      <path d="M150,0 C145,200 120,430 110,640"/>
      <path d="M95,0 C90,210 65,450 55,660"/>
      <path d="M40,0 C36,220 15,460 8,650"/>
      <path d="M1660,0 C1670,180 1685,380 1690,560"/>
      <path d="M1715,0 C1722,190 1740,400 1750,600"/>
      <path d="M1770,0 C1775,200 1800,430 1810,640"/>
      <path d="M1825,0 C1830,210 1855,450 1865,660"/>
      <path d="M1880,0 C1884,220 1905,460 1912,650"/>
    </g>
  </g>
  <rect x="6" y="6" width="1908" height="1068" rx="22" stroke-opacity=".2"/>
</g>

<!-- thin diagonal struts, canopy edge inward: the structural armature that reads as
     "cockpit" without adding mass. Visible in the ultrawide-short crop (y ~483-1080).
     The corner between the canopy edge and each pod (below) is left fully open. -->
<g id="struts" fill="none" stroke="#DDE7EE" stroke-linecap="round">
  <path d="M0,470 L260,560" stroke-width="1.5" stroke-opacity=".22"/>
  <path d="M0,470 L200,700" stroke-width="1.5" stroke-opacity=".16"/>
  <path d="M0,650 L260,560" stroke-width="1.5" stroke-opacity=".16"/>
  <path d="M0,650 L150,800" stroke-width="1.5" stroke-opacity=".22"/>
  <path d="M1920,470 L1660,560" stroke-width="1.5" stroke-opacity=".22"/>
  <path d="M1920,470 L1720,700" stroke-width="1.5" stroke-opacity=".16"/>
  <path d="M1920,650 L1660,560" stroke-width="1.5" stroke-opacity=".16"/>
  <path d="M1920,650 L1770,800" stroke-width="1.5" stroke-opacity=".22"/>
</g>

<!-- arm consoles: floating instrument pods, not a slab reaching the canopy edge.
     Fill stays <=0.3 opacity so the city and struts read through; the pod's own
     top edge sits at ~y790 (down from 655), well clear of the canopy corner. -->
<g id="arm-consoles" fill="#060A12" fill-opacity=".24" stroke="#8CFFC1" stroke-width="1.5" stroke-opacity=".55" stroke-linejoin="round">
  <path d="M110,1080 L140,790 L195,794 L195,821 L250,844 L288,975 L288,1080 Z"/>
  <path d="M1810,1080 L1780,790 L1725,794 L1725,821 L1670,844 L1632,975 L1632,1080 Z"/>
</g>
<g id="arm-ribs" fill="none" stroke="#8CFFC1" stroke-width="1" stroke-opacity=".2">
  <path d="M140,790 L142,1080"/>
  <path d="M175,793 L176,1080"/>
  <path d="M195,794 L198,1080"/>
  <path d="M250,844 L251,1080"/>
  <path d="M1780,790 L1778,1080"/>
  <path d="M1745,793 L1744,1080"/>
  <path d="M1725,794 L1722,1080"/>
  <path d="M1670,844 L1669,1080"/>
</g>

<g id="keys" fill="#8CFFC1" fill-opacity=".5">
  <rect x="150" y="900" width="26" height="6" rx="2"/>
  <rect x="150" y="930" width="26" height="6" rx="2"/>
  <rect x="150" y="960" width="18" height="6" rx="2"/>
  <rect x="1744" y="900" width="26" height="6" rx="2"/>
  <rect x="1744" y="930" width="26" height="6" rx="2"/>
  <rect x="1752" y="960" width="18" height="6" rx="2"/>
</g>

<!-- centre console: a glass shelf, not a wall. Cut from 162-189px tall to ~87-95px
     and made translucent, with a bright lip line marking the front edge. -->
<g id="centre-console" fill="#060A12" fill-opacity=".45">
  <path d="M288,985 L400,989 L700,991 L960,993 L1220,991 L1520,989 L1632,985 L1632,1080 L288,1080 Z"/>
</g>
<g id="centre-lip" fill="none" stroke="#8CFFC1" stroke-width="1.5" stroke-opacity=".7">
  <path d="M288,985 L400,989 L700,991 L960,993 L1220,991 L1520,989 L1632,985"/>
</g>

<g id="console-readouts">
  <g fill="none" stroke="#DDE7EE" stroke-width="1" stroke-opacity=".7">
    <rect x="754" y="993" width="14" height="40" rx="1.5"/>
    <rect x="1152" y="993" width="14" height="40" rx="1.5"/>
  </g>
  <g fill="#DDE7EE" fill-opacity=".2" stroke="none">
    <rect x="757" y="999" width="8" height="17"/>
    <rect x="1155" y="999" width="8" height="17"/>
  </g>
  <g fill="#8CFFC1" fill-opacity=".55" stroke="none">
    <rect x="757" y="1020" width="8" height="10"/>
    <rect x="1155" y="1020" width="8" height="10"/>
  </g>
  <g fill="#8CFFC1" fill-opacity=".7" stroke="none">
    <circle cx="944" cy="1038" r="2.5"/>
    <circle cx="960" cy="1038" r="2.5"/>
    <circle cx="976" cy="1038" r="2.5"/>
  </g>
</g>

<g id="caution" fill="none" stroke="#FFB02E" stroke-width="1.5" stroke-linecap="square">
  <path d="M1270,1045 L1280,1026 L1290,1045 Z"/>
  <line x1="1280" y1="1034" x2="1280" y2="1039"/>
</g>

<g id="registration" fill="none" stroke="#8CFFC1" stroke-width="1.5" stroke-opacity=".55" stroke-linecap="square">
  <path d="M28,28 L28,72 M28,28 L72,28"/>
  <path d="M1892,28 L1892,72 M1892,28 L1848,28"/>
  <path d="M28,1052 L28,1008 M28,1052 L72,1052"/>
  <path d="M1892,1052 L1892,1008 M1892,1052 L1848,1052"/>
</g>
</svg>
