# Publishes site4 (BUNNyS) to GitHub Pages at https://lyu0131.github.io/neocities/
# Only the pages and their assets ship; docs/, tests/, tools/ and DESIGN.md stay in the repo.
name: Deploy site4 to Pages

on:
  push:
    branches: [main]
    paths: ['site4/**', '.github/workflows/pages-site4.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site4 pages and assets
        run: |
          mkdir _site
          cp site4/*.html _site/
          cp -r site4/css site4/js site4/img _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
